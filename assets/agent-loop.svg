<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">An evidence-driven agent workflow</title>
  <desc id="desc">Conceptual design, not a deployed system claim. Goal and context lead to a bounded plan, a policy and approval gate, scoped tool execution, and validation with a checkpoint. Required human review precedes tool execution. A failed validation returns to planning within a retry limit.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071518"/><stop offset="1" stop-color="#03090C"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#214A4D" stroke-opacity=".16"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#2DE2C2" stroke-width="1.2"/></marker>
    <marker id="muted" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#568681" stroke-width="1.2"/></marker>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.sans{font-family:Arial,Helvetica,sans-serif}
      .flow{stroke-dasharray:4 6;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-40}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="999" height="419" rx="15" fill="url(#bg)" stroke="#24504F"/>
  <rect x="1" y="1" width="998" height="418" rx="15" fill="url(#grid)"/>
  <text x="33" y="37" fill="#2DE2C2" font-size="10" letter-spacing="2.5">ENGINEERING MODEL // AGENT CONTROL LOOP</text>
  <text x="32" y="77" class="sans" fill="#E6FAF5" font-size="27" font-weight="700">Autonomy with observable decisions.</text>
  <text x="968" y="38" text-anchor="end" fill="#719492" font-size="9">CONCEPTUAL WORKFLOW</text>
  <text x="33" y="102" fill="#87A9A7" font-size="11">Bound the task. Check permission. Verify the result. Preserve the evidence.</text>
  <g fill="none" stroke="#2DE2C2" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M194 192H224"/><path d="M384 192H414"/><path d="M574 192H604"/><path d="M764 192H794"/>
  </g>
  <g fill="none" stroke="#2DE2C2" stroke-opacity=".4" stroke-width="1.5" class="flow"><path d="M194 192H224M384 192H414M574 192H604M764 192H794"/></g>
  <g>
    <rect x="34" y="143" width="160" height="100" rx="9" fill="#0A1A1E" stroke="#275350"/>
    <text x="49" y="167" fill="#3D8178" font-size="10">01 / INPUT</text><text x="49" y="193" fill="#DCF6EE" class="sans" font-size="16" font-weight="700">Goal + context</text><text x="49" y="218" fill="#8AAEAA" font-size="10">task · sources · limits</text>
    <rect x="224" y="143" width="160" height="100" rx="9" fill="#0A1A1E" stroke="#275350"/>
    <text x="239" y="167" fill="#3D8178" font-size="10">02 / REASON</text><text x="239" y="193" fill="#DCF6EE" class="sans" font-size="16" font-weight="700">Bounded plan</text><text x="239" y="218" fill="#8AAEAA" font-size="10">steps · budget · stop</text>
    <rect x="414" y="143" width="160" height="100" rx="9" fill="#0B2324" stroke="#2DE2C2" stroke-opacity=".7"/>
    <text x="429" y="167" fill="#4DB9A8" font-size="10">03 / AUTHORIZE</text><text x="429" y="193" fill="#DCF6EE" class="sans" font-size="16" font-weight="700">Policy + approval</text><text x="429" y="218" fill="#8AAEAA" font-size="10">scope · risk · consent</text>
    <rect x="604" y="143" width="160" height="100" rx="9" fill="#0A1A1E" stroke="#275350"/>
    <text x="619" y="167" fill="#3D8178" font-size="10">04 / EXECUTE</text><text x="619" y="193" fill="#DCF6EE" class="sans" font-size="16" font-weight="700">Tool execution</text><text x="619" y="218" fill="#8AAEAA" font-size="10">scoped call · typed I/O</text>
    <rect x="794" y="143" width="172" height="100" rx="9" fill="#0A1A1E" stroke="#275350"/>
    <text x="809" y="167" fill="#3D8178" font-size="10">05 / VERIFY</text><text x="809" y="193" fill="#DCF6EE" class="sans" font-size="15" font-weight="700">Validate + checkpoint</text><text x="809" y="218" fill="#8AAEAA" font-size="10">evidence · state · trace</text>
  </g>
  <g fill="none" stroke-width="1.2">
    <path d="M494 243V280" stroke="#2DE2C2" marker-end="url(#arrow)"/>
    <path d="M574 306H684V249" stroke="#2DE2C2" marker-end="url(#arrow)"/>
    <path d="M880 243V354H304V249" stroke="#568681" stroke-dasharray="4 5" marker-end="url(#muted)"/>
  </g>
  <text x="508" y="265" fill="#719E97" font-size="9">when required</text>
  <rect x="414" y="281" width="160" height="50" rx="8" fill="#0A2022" stroke="#2E786D"/>
  <text x="494" y="303" text-anchor="middle" fill="#BAE9DB" class="sans" font-size="13" font-weight="700">Human review</text><text x="494" y="320" text-anchor="middle" fill="#719E97" font-size="9">approve / revise / stop</text>
  <text x="626" y="294" text-anchor="middle" fill="#719E97" font-size="9">approved</text>
  <rect x="397" y="345" width="377" height="18" fill="#061115"/>
  <text x="586" y="358" text-anchor="middle" fill="#719492" font-size="10">failed check → revise plan within retry limit</text>
  <circle class="pulse" cx="948" cy="118" r="3" fill="#2DE2C2"/>
  <path d="M33 383H967" stroke="#173A3D"/>
  <text x="34" y="403" fill="#4E7976" font-size="9">DESIGN PRINCIPLES</text><text x="179" y="403" fill="#82AAA3" font-size="9">bounded execution</text><text x="357" y="403" fill="#82AAA3" font-size="9">explicit approval</text><text x="534" y="403" fill="#82AAA3" font-size="9">verifiable output</text><text x="714" y="403" fill="#82AAA3" font-size="9">recoverable progress</text>
</svg>
