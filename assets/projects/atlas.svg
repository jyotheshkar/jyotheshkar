<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-labelledby="title desc">
<title id="title">Atlas</title><desc id="desc">Working local public evidence viewer with an allowlisted six-project registry, a generated read-only worker and privacy and route checks. Public mode is unconnected and contains no private career data or live provider adapter.</desc>
