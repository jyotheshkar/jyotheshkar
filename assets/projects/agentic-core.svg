<text x="24" y="39" font-family="monospace" font-size="10" fill="#4493F8" font-weight="600" text-anchor="start">01 / WORKFLOW ENGINE</text>
<text x="24" y="70" font-family="Arial, sans-serif" font-size="25" fill="#F0F6FC" font-weight="700" text-anchor="start">Agentic Core</text>
<text x="24" y="91" font-family="Arial, sans-serif" font-size="12" fill="#9198A1" font-weight="400" text-anchor="start">Governed execution with an explicit host boundary.</text>
