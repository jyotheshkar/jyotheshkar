<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-labelledby="title desc">
<title id="title">Agentic Core</title><desc id="desc">Local sequential Python workflow runtime: typed contracts, deterministic capability selection, approvals, host handoff, SQLite checkpoints and bounded recovery. The host supplies model reasoning and tools.</desc>
