<title id="title">PrimeLift</title><desc id="desc">Synthetic campaign-analysis prototype with treatment-effect estimators, uplift comparisons and saved decision reports. Diagram represents synthetic treatment and control structure, not real campaign impact. Partially integrated interface; current model selection reuses the test split.</desc>
