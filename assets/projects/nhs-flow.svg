<title id="title">NHS Elective Flow</title><desc id="desc">Independent prototype for aggregate public NHS England data: ingestion, data quality, priority scoring, forecasting and illustrative capacity scenarios. No NHS affiliation, patient data or clinical deployment. Diagram describes methodology, not measured outcomes.</desc>
