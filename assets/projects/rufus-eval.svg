<title id="title">Rufus Eval Engine</title><desc id="desc">Independent shopping-assistant evaluation prototype using FAISS retrieval, assistant and judge components, four scoring dimensions, SQLite and a dashboard. Default mock scores demonstrate contracts and wiring, not empirical model quality. Not affiliated with Amazon.</desc>
