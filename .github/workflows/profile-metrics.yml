name: Validate GitHub profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/profile-metrics.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate profile assets and links
        run: python3 scripts/validate_profile.py
